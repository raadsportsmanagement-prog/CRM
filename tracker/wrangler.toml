name = "crm-medidor"
main = "worker.js"
account_id = "37a4f1c5346b8417a7e4d73114b5b281" # cuenta ivan@raadsports.com, la misma del CRM
compatibility_date = "2025-01-01"

# Donde se anotan los eventos. Crea el espacio con:
#   npx wrangler kv namespace create EVENTOS
# y pega abajo el id que imprime.
#
# El mismo espacio guarda ahora el permiso de Google Ads, que el puente pide
# una vez y renueva solo. Por eso hace falta aunque no midas correos.
[[kv_namespaces]]
binding = "EVENTOS"
id = "c7e35f61a51d49aeab9eed36a352dac4"

# La clave NO va en este archivo: este archivo entra al repositorio.
# Se guarda cifrada en Cloudflare con:
#   npx wrangler secret put CLAVE

# ─────────────────────────────────────────────────────────────
# El puente: Meta, WhatsApp y Google Ads
#
# Aquí abajo van sólo identificadores —el número de una página, el de una
# cuenta publicitaria—. No son secretos: no sirven para entrar a ninguna
# parte, y quien vea este archivo ya tiene el repositorio.
#
# Los tokens son otra cosa y NO van aquí. Cada uno se guarda cifrado con
# `npx wrangler secret put NOMBRE`, y la lista está en el README.
#
# Deja en blanco lo que no uses: el puente apaga solo la parte que le falte
# configuración, en vez de fallar a medias.
# ─────────────────────────────────────────────────────────────
[vars]
# Meta — la página de Facebook cuyos formularios de Lead Ads se leen.
# Está en la página → Configuración → Información, como "Identificador".
META_PAGE_ID = "100575104770549"

# Meta — la cuenta publicitaria, para las métricas de campaña.
# Está en el Administrador de anuncios, arriba, como "act_123456789".
META_AD_ACCOUNT = "act_281487689280491"

# WhatsApp — el identificador del número remitente. NO es el número de
# teléfono: está en developers.facebook.com → tu app → WhatsApp → Configuración
# de la API, como "Identificador del número de teléfono".
WA_PHONE_ID = "1339016502634465"

# Meta — el identificador de la app (developers.facebook.com → Mis apps). Hace
# falta para subir la imagen de ejemplo al crear una plantilla con imagen.
META_APP_ID = "1768965847650468"

# WhatsApp — la cuenta donde viven las plantillas, para crearlas y leer las
# aprobadas. Está en business.facebook.com → Configuración → Cuentas → Cuentas
# de WhatsApp: la que tiene el número en su pestaña "Números de teléfono".
# No es el identificador que muestra developers.facebook.com junto al número:
# con el modelo nuevo de Meta ese es la cuenta del número, y crear plantillas
# ahí da "WhatsApp accounts cannot be used with this API" (100/2388339).
WA_WABA_ID = "1784255429408787"

# WhatsApp por Twilio — en vez de Meta. Con TWILIO_ACCOUNT_SID puesto, todo
# WhatsApp sale y entra por Twilio y lo de WA_* de arriba se ignora; vacío,
# sigue por Meta. Los dos están en console.twilio.com:
#   · el Account SID, en la portada (empieza por "AC"). No es secreto: el
#     secreto es el Auth Token, que va con `wrangler secret put TWILIO_AUTH_TOKEN`.
#   · el número virtual ya aprobado para WhatsApp, con su indicativo, p. ej.
#     "+15551234567". Está en Messaging → Senders → WhatsApp senders.
TWILIO_ACCOUNT_SID = ""
TWILIO_WA_FROM = ""

# Google Ads — el ID de cliente de OAuth (termina en .apps.googleusercontent.com).
# Identifica la aplicación, no a ti; el secreto sí va aparte.
GADS_CLIENT_ID = ""

# Google Ads — el número de la cuenta que se va a leer, con o sin guiones.
GADS_CUSTOMER_ID = ""

# Google Ads — sólo si esa cuenta cuelga de una cuenta administradora (MCC):
# el número del MCC. Si la cuenta es suelta, déjalo en blanco; ponerlo igual
# hace que Google conteste que la cuenta no existe.
GADS_LOGIN_CUSTOMER_ID = ""
